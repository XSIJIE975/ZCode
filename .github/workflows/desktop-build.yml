# 桌面端三平台打包。流程规范见 docs/specs/github-actions-desktop-build.md：
# 打包逻辑唯一所有者是 packages/desktop/scripts/bundle.mjs，本文件只负责
# 工具链安装、环境变量与产物上传，不复制任何打包步骤。
name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      # 只认 xcode- 前缀的 tag 作为发布入口：main 追踪上游，若日后同步上游的 v* tag
      # 并误推到 origin，不会意外触发发布。发版请打 xcode-v<version>（指向 feature/xcode 的提交）。
      - "xcode-v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地 Preview 包同一套身份语义：生产后端 + 可与正式版并排安装的
  # 「ZCode Preview」身份（机制见 packages/desktop/scripts/desktop-product-identity.mjs）。
  ZCODE_ENV: production
  ZCODE_PREVIEW_IDENTITY: "1"

jobs:
  bundle:
    name: bundle ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win
            arch: x64
            runner: windows-latest
            electron-cache: "~\\AppData\\Local\\electron\\Cache"
            builder-cache: "~\\AppData\\Local\\electron-builder\\cache"
          - target: mac
            arch: arm64
            runner: macos-latest
            electron-cache: "~/.cache/electron"
            builder-cache: "~/.cache/electron-builder"
          - target: linux
            arch: x64
            runner: ubuntu-latest
            electron-cache: "~/.cache/electron"
            builder-cache: "~/.cache/electron-builder"

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与 mise.toml 保持一致
          node-version: "24.14.0"
          cache: pnpm

      - name: Cache Electron runtimes
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.electron-cache }}
            ${{ matrix.builder-cache }}
          key: electron-${{ matrix.target }}-${{ matrix.arch }}-41.0.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux build prerequisites
        # pacman 目标的 fpm 依赖 bsdtar（libarchive），ubuntu runner 未预装
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Bundle
        run: pnpm bundle:desktop -- --os ${{ matrix.target }} --arch ${{ matrix.arch }}
        env:
          # GitHub runner 直连官方源；bundle.mjs 默认的 npmmirror 镜像留给国内本地环境
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          # CI 先例：Windows 桌面安装包不依赖 mock-cdn remote 资产，跳过跨平台资源下载
          ZCODE_SKIP_REMOTE_ASSETS: ${{ matrix.target == 'win' && '1' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pacman.tar.zst
          if-no-files-found: error
          retention-days: 14

  # 发布 job：只有正式 tag 推送才执行。tag 名含 -test（如 xcode-v3.14.3-test1）时
  # 只构建不发布，用作三平台验证。等三个平台的 bundle job 全部成功后，
  # 把全部产物挂到一个 GitHub Release 上，供他人直接下载。
  release:
    name: publish release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-test')
    runs-on: ubuntu-latest
    permissions:
      # 创建 Release 与上传产物需要写 contents
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<'EOF'
          ZCode 二次开发版桌面安装包（自动构建，未签名）。

          - Windows: `*-win-x64.exe`（NSIS 安装器）
          - macOS: `*-mac-arm64.dmg` / `.zip`（未签名，首次打开需执行
            `sudo xattr -rd com.apple.quarantine "/Applications/ZCode Preview.app"`）
          - Linux: `*-linux-x64.AppImage` / `.deb` / `.rpm` / `.pacman.tar.zst`

          身份为「ZCode Preview」（appId dev.zcode.app.preview），可与官方 ZCode 并排安装，
          连接生产后端；业务数据与官方版共享 ~/.zcode。
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            # 重跑 workflow 时 Release 已存在：只覆盖同名产物
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes_file" artifacts/*
          fi
